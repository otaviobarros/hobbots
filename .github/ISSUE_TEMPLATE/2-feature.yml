name: Feature request
description: Propose new behavior for Hobbots.
labels: ["type: feature", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [MVP requirements](https://github.com/otaviobarros/hobbots/blob/main/docs/product/mvp-requirements.md) and [open questions](https://github.com/otaviobarros/hobbots/blob/main/docs/product/open-questions.md) first. Some ideas are already planned or decided.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Hobbots do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
