name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every push to main gets its own group and result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  TURBO_CACHE_DIR: .turbo/cache
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, typecheck and test (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      # The memory engine's contract tests run against the pinned ai-memory release (ADR 028), which
      # fetch-engine downloads and checks against its pinned SHA-256; the pin names the cache.
      - uses: actions/cache@v6
        with:
          path: packages/memory/engine
          key: memory-engine-${{ runner.os }}-${{ hashFiles('packages/memory/src/engine/release.ts') }}
      - run: pnpm --filter @hobbots/memory fetch-engine
      - run: pnpm check
        env:
          HOBBOTS_MEMORY_CONTRACT: 1

  postgres:
    name: Persistence and server tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Debian image: its en_US.utf8 collation is what the tie-order test needs to detect a missing COLLATE "C".
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      HOBBOTS_TEST_DB: postgres
      HOBBOTS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm turbo run test --filter=@hobbots/persistence --filter=@hobbots/server

  # The browser tests run in four shards side by side, balanced by recorded test times
  # (apps/web/e2e/shards.ts). Each shard is a Turbo task with its own cache, so a change that
  # touches neither the web client nor the server and its packages replays the last result.
  browser-tests:
    name: Browser tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      HOBBOTS_E2E_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-
      # A cached result needs no browser, so the browser steps are skipped.
      - id: turbo
        name: Look for a cached result
        run: |
          status=$(pnpm turbo run test:e2e --filter=@hobbots/web --dry=json |
            jq -r '.tasks[] | select(.taskId == "@hobbots/web#test:e2e") | .cache.status')
          echo "Cache: $status"
          echo "hit=$([[ "$status" == "HIT" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: playwright
        if: steps.turbo.outputs.hit != 'true'
        name: Read the Playwright version
        run: echo "version=$(pnpm --filter @hobbots/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # The tests run headless, so the headless shell is the only browser they need. The runner
      # image already has the system libraries it uses.
      - id: browsers
        if: steps.turbo.outputs.hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.turbo.outputs.hit != 'true' && steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @hobbots/web exec playwright install --only-shell chromium
      # Builds the web client and the server, then runs this shard's tests.
      - run: pnpm turbo run test:e2e --filter=@hobbots/web
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: first-launch-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # One result for the whole browser suite under its usual name: green only when every shard is.
  first-launch:
    name: First launch in a browser
    needs: browser-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.browser-tests.result != 'success'
        run: |
          echo "A browser test shard ended ${{ needs.browser-tests.result }}."
          exit 1
      - run: echo "Every browser test shard passed."
