name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every push to main gets its own group and result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  TURBO_CACHE_DIR: .turbo/cache
  TURBO_TELEMETRY_DISABLED: 1

# The test jobs run on Instabox machines (4 vCPUs, 8 GB, Ubuntu 24.04), which start as many at once
# as the plan allows, so parallel pull requests don't queue behind each other (#1524). A pull request
# from a fork runs on GitHub-hosted runners, so its code never runs on the project's Instabox
# account. Setting the repository variable CI_RUNNER to `ubuntu-latest` moves every job back to
# GitHub. The jobs that only gather results stay on GitHub-hosted runners.
jobs:
  # `pnpm check` runs in three jobs side by side: every check but the server suite in one, and the
  # server suite, the longest task, in two shards of its own (#1442). The check the main ruleset
  # requires is the job after them, which passes only when all three pass.
  check-packages:
    name: Lint, typecheck and package tests (SQLite)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'instabox-medium' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - uses: ./.github/actions/memory-engine
      # The server's typecheck still runs here, as the desktop app depends on it.
      - run: pnpm check '--filter=!@hobbots/server'
        env:
          HOBBOTS_MEMORY_CONTRACT: 1
          # Turbo runs four tasks at once, and Vitest would give each one a worker for every CPU
          # but one. Two each keeps the test workers, lint and typecheck from crowding the four
          # CPUs, so a test that waits on the hub is not starved (#985).
          VITEST_MAX_WORKERS: 2

  check-server:
    name: Server tests (SQLite ${{ matrix.shard }}/2)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'instabox-medium' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      HOBBOTS_MEMORY_CONTRACT: 1
      # The suite has the runner to itself, and its tests mostly wait on the hub, so three
      # workers keep the four CPUs busy without starving one (#985).
      VITEST_MAX_WORKERS: 3
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-
      - uses: ./.github/actions/memory-engine
      - run: pnpm turbo run test --filter=@hobbots/server -- --shard=${{ matrix.shard }}/2

  check:
    name: Lint, typecheck and test (SQLite)
    needs: [check-packages, check-server]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          PACKAGES: ${{ needs.check-packages.result }}
          SERVER: ${{ needs.check-server.result }}
        run: |
          echo "The checks ended: $PACKAGES; the server shards ended: $SERVER."
          [[ "$PACKAGES" == success && "$SERVER" == success ]]

  # The PostgreSQL suites run in two shards side by side, each half of every suite's files, so the
  # job takes about as long as the SQLite one (#1066). The check the main ruleset requires is the
  # job after them, which passes only when both shards pass.
  postgres-shards:
    name: Persistence and server tests (PostgreSQL ${{ matrix.shard }}/2)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'instabox-medium' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        # Debian image: its en_US.utf8 collation is what the tie-order test needs to detect a missing COLLATE "C".
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      HOBBOTS_TEST_DB: postgres
      HOBBOTS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The two suites run at once, beside the database. The tests mostly wait on the database, so
      # three workers each keep the four CPUs busy; the persistence suite ends well before the
      # server suite, which then has them to itself (#1066).
      VITEST_MAX_WORKERS: 3
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-
      # Each test copies a fresh database from a migrated template, and a test database needs no
      # crash safety, so the server skips flushing each commit to disk (#1066).
      - name: Let the test database skip flushing to disk
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U postgres
          -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - run: >-
          pnpm turbo run test --filter=@hobbots/persistence --filter=@hobbots/server
          -- --shard=${{ matrix.shard }}/2

  postgres:
    name: Persistence and server tests (PostgreSQL)
    needs: postgres-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.postgres-shards.result }}
        run: |
          echo "The PostgreSQL shards ended: $RESULT."
          [[ "$RESULT" == success ]]

  # The browser tests run in eight shards side by side, balanced by recorded test times
  # (apps/web/e2e/shards.ts), with two workers to a runner so each hub and browser gets a CPU
  # (#985). Each shard is a Turbo task with its own cache, so a change that touches neither the web
  # client nor the server and its packages replays the last result.
  browser-tests:
    name: Browser tests (${{ matrix.shard }}/8)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'instabox-medium' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      HOBBOTS_E2E_SHARD: ${{ matrix.shard }}/8
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-
      # A cached result needs no browser, so the browser steps are skipped.
      - id: turbo
        name: Look for a cached result
        run: |
          status=$(pnpm turbo run test:e2e --filter=@hobbots/web --dry=json |
            jq -r '.tasks[] | select(.taskId == "@hobbots/web#test:e2e") | .cache.status')
          echo "Cache: $status"
          echo "hit=$([[ "$status" == "HIT" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.turbo.outputs.hit != 'true'
        uses: ./.github/actions/playwright
      # Builds the web client and the server, then runs this shard's tests. A failed test runs once
      # more; one that then passes leaves the job green and is listed by the next step.
      - run: pnpm turbo run test:e2e --filter=@hobbots/web
      # A cached result replays the report and traces of the run that recorded it, flaky tests
      # included, so they are listed again, marked as cached.
      - id: flaky
        if: always()
        name: List flaky and failed tests in the job summary
        env:
          HIT: ${{ steps.turbo.outputs.hit }}
        run: |
          summary=$(node scripts/flaky-tests.mjs apps/web/test-results/report.json)
          if [[ -n "$summary" ]]; then
            if [[ "$HIT" == true ]]; then
              summary=$(printf '%s\n\n%s' "This shard replayed a cached result: these tests come from the run that recorded it." "$summary")
            fi
            printf '%s\n\nEach trace is in the `browser-report-%s` artifact of this run.\n' "$summary" "${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: failure() || steps.flaky.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: browser-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
      # Each shard's test times on main, which the weekly refresh writes to e2e/durations.json
      # (.github/workflows/test-times.yml).
      - if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: browser-times-${{ matrix.shard }}
          path: apps/web/test-results/report.json
          if-no-files-found: ignore
          retention-days: 14

  # Runs each browser test a pull request adds or changes, and each test whose spec file imports a
  # changed helper, five times, and fails on one that passes only on a retry. A new flaky test then
  # fails its own pull request instead of main (STD-TEST-009). A change that reaches more tests than
  # MAX_TESTS, such as one to e2e/hub.ts, is left to the nightly flake hunt (flake-hunt.yml). Five
  # runs of a spec file's slow orchestration tests take longer than a shard, so the run's own time
  # limit is raised to fit, as the flake hunt does.
  burn-in:
    name: Burn in changed browser tests
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'instabox-medium' }}
    timeout-minutes: 35
    env:
      BASE_REF: ${{ github.base_ref }}
      MAX_TESTS: 16
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The checkout is the pull request merged into its base, so its difference from the base's
      # tip is exactly the pull request's change.
      - run: git fetch --no-tags --depth=1 origin "$BASE_REF"
      - id: changed
        name: Count the changed tests
        working-directory: apps/web
        run: |
          list=$(pnpm exec playwright test --list --reporter=list --only-changed="origin/$BASE_REF" || true)
          count=$(sed -n 's/^Total: \([0-9]*\) tests\{0,1\} in .*/\1/p' <<< "$list")
          count=${count:-0}
          echo "Changed tests: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if (( count > MAX_TESTS )); then
            echo "This change reaches $count browser tests, more than the $MAX_TESTS this job burns in. The nightly flake hunt runs them all." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.changed.outputs.count > 0 && steps.changed.outputs.count <= fromJSON(env.MAX_TESTS)
        id: run
        run: pnpm turbo run build --filter=@hobbots/web
      - if: steps.run.outcome == 'success'
        uses: ./.github/actions/playwright
      - if: steps.run.outcome == 'success'
        working-directory: apps/web
        run: pnpm exec playwright test --only-changed="origin/$BASE_REF" --repeat-each=5 --fail-on-flaky-tests --global-timeout=1800000
      - id: flaky
        if: always() && steps.run.outcome == 'success'
        name: List flaky and failed tests in the job summary
        run: |
          summary=$(node scripts/flaky-tests.mjs apps/web/test-results/report.json)
          if [[ -n "$summary" ]]; then
            printf '%s\n\nEach trace is in the `burn-in-report` artifact of this run.\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.flaky.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: burn-in-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
