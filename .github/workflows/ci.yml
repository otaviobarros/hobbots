name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every push to main gets its own group and result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  TURBO_CACHE_DIR: .turbo/cache
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, typecheck and test (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Reads the version from `packageManager`.
      - uses: pnpm/action-setup@v6
      # Reads the version from `engines.node`.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  postgres:
    name: Persistence and server tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Debian image: its en_US.utf8 collation is what the tie-order test needs to detect a missing COLLATE "C".
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      HOBBOTS_TEST_DB: postgres
      HOBBOTS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --filter=@hobbots/persistence --filter=@hobbots/server

  first-launch:
    name: First launch in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        name: Read the Playwright version
        run: echo "version=$(pnpm --filter @hobbots/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # The tests run headless, so the headless shell is the only browser they need.
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @hobbots/web exec playwright install --with-deps --only-shell chromium
      # The system libraries are not in the cache.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @hobbots/web exec playwright install-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: first-launch-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
