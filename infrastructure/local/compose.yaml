# PostgreSQL for the persistence and server test suites (ADR 011). Test use only:
# no password, reachable only from this machine, and the data is gone when the container stops.
name: hobbots-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hobbots_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      # TCP, not the socket: during first start the image runs a socket-only server to create the database.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=hobbots_test"]
      interval: 1s
      timeout: 3s
      retries: 30
