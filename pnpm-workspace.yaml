packages:
  - apps/*
  - packages/*
# `pnpm add` records the exact version it installed, never a range (STD-DOCS-006).
saveExact: true
# Every Effect package moves together at one exact version (STD-EFFECT-005).
catalog:
  "@effect/platform-node": 4.1.1
  "@effect/sql-pg": 4.1.1
  "@effect/sql-sqlite-node": 4.1.1
  effect: 4.1.1
allowBuilds:
  electron: true
  esbuild: true
  # Windows installer helper pulled in by electron-builder; macOS packaging does not need it.
  electron-winstaller: false
permissions:
  "@tanstack/react-router":
    skills: true
minimumReleaseAgeExclude:
  - "@effect/platform-node-shared@4.1.1"
  - "@effect/platform-node@4.1.1"
  - "@effect/sql-pg@4.1.1"
  - "@effect/sql-sqlite-node@4.1.1"
  - effect@4.1.1
